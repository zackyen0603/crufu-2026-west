name: Fetch RideWithGPS route tracks
on:
  push:
    paths:
      - 'scripts/fetch_routes.py'
      - '.github/workflows/fetch-route-tracks.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch route geometries
        run: python scripts/fetch_routes.py
      - name: Commit route tracks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add route_tracks.js
          if git diff --cached --quiet; then
            echo "No route changes"
          else
            git commit -m "Update RideWithGPS route tracks"
            git push
          fi
