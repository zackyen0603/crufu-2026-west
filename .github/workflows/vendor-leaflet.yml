name: Vendor Leaflet assets
on:
  push:
    paths:
      - '.github/workflows/vendor-leaflet.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Leaflet locally
        run: |
          mkdir -p vendor
          curl -fL --retry 3 https://unpkg.com/leaflet@1.9.4/dist/leaflet.js -o vendor/leaflet.js
          curl -fL --retry 3 https://unpkg.com/leaflet@1.9.4/dist/leaflet.css -o vendor/leaflet.css
          test -s vendor/leaflet.js
          test -s vendor/leaflet.css
      - name: Commit vendor assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/leaflet.js vendor/leaflet.css
          git diff --cached --quiet && exit 0
          git commit -m "Vendor Leaflet assets for offline-stable map rendering"
          git push
